<!doctype html><html lang="bn"><script>(function(){try{var s=new URLSearchParams(location.search).get('school');if(s&&/^[a-z0-9-]+$/i.test(s)){document.cookie='bhs_school='+encodeURIComponent(s.toLowerCase())+'; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শিক্ষার্থী ড্যাশবোর্ড</title><link rel="stylesheet" href="fonts.css"><style>body{font-family:Kalpurush;margin:0;background:#f4faf8;color:#173b50}.wrap{max-width:1050px;margin:25px auto;padding:0 15px}.head,.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 5px 18px #123b5d12}.head{background:#087457;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h3{margin-top:0;color:#087457} @media(max-width:700px){.grid{grid-template-columns:1fr}}button{padding:9px 15px;border:0;border-radius:7px;background:#fff;color:#087457;cursor:pointer}</style><main class="wrap"><section class="head"><h1 id="name">শিক্ষার্থী ড্যাশবোর্ড</h1><p id="meta">তথ্য লোড হচ্ছে...</p><button onclick="logout()">Logout</button></section><section class="grid"><article class="card"><h3>ফলাফল</h3><div id="result">তথ্য নেই</div></article><article class="card"><h3>উপস্থিতি</h3><div id="attendance">তথ্য নেই</div></article><article class="card"><h3>ফি ও বকেয়া</h3><div id="fees">তথ্য নেই</div></article></section><section class="card"><h3>সাম্প্রতিক নোটিশ</h3><div id="notices">তথ্য নেই</div></section></main><script>async function load(){let r=await fetch('/.netlify/functions/role-api',{credentials:'same-origin'});if(!r.ok){location.href='student-login.html';return}let d=await r.json();name.textContent=d.user.name||'শিক্ষার্থী ড্যাশবোর্ড';meta.textContent='Student ID: '+(d.user.id||'');result.textContent=JSON.stringify(d.result||[]);attendance.textContent=JSON.stringify(d.attendance||[]);fees.textContent=JSON.stringify(d.fees||[]);notices.innerHTML=(d.notices||[]).map(x=>'<p>'+String(x.title||'')+'</p>').join('')||'তথ্য নেই'}async function logout(){await fetch('/.netlify/functions/auth?action=logout');location.href='student-login.html'}load()</script>
