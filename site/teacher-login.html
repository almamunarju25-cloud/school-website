<!doctype html><html lang="bn"><script>(function(){try{var s=new URLSearchParams(location.search).get('school');if(s&&/^[a-z0-9-]+$/i.test(s)){document.cookie='bhs_school='+encodeURIComponent(s.toLowerCase())+'; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শিক্ষক লগইন</title><link rel="stylesheet" href="fonts.css"><style>body{font-family:Kalpurush;margin:0;background:#eef6ff;color:#173b50}.box{max-width:430px;margin:10vh auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 30px #123b5d22}h1{margin-top:0;color:#1266cf}label{display:grid;gap:6px;margin:14px 0}input{padding:12px;border:1px solid #ccd8e5;border-radius:8px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:8px;background:#1375eb;color:#fff;font:inherit;cursor:pointer}.err{color:#b42332;text-align:center;min-height:22px}</style><main class="box"><h1>শিক্ষক লগইন</h1><p>নিজের ই-মেইল/ইউজার আইডি ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p><form id="f"><label>ই-মেইল বা User ID<input id="i" required></label><label>পাসওয়ার্ড<input id="p" type="password" required></label><div id="e" class="err"></div><button>ড্যাশবোর্ডে প্রবেশ করুন</button></form></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/.netlify/functions/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({role:'teacher',identity:i.value,password:p.value})});if(!r.ok){document.getElementById('e').textContent='তথ্য সঠিক নয়';return}location.href='teacher-dashboard.html'}</script>
