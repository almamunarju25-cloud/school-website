<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>শিক্ষক-কর্মচারী বিস্তারিত | বল্লভপুর উচ্চ বিদ্যালয়</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f6f7;font-family:"Noto Sans Bengali","Kalpurush","Times New Roman",sans-serif;color:#294f58}.shell{width:min(1120px,94%);margin:28px auto 60px}
.hero{min-height:120px;background:linear-gradient(115deg,#337d87,#6cc0c8);border-radius:18px 18px 0 0;color:#fff;padding:24px 30px;display:flex;align-items:center;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff24;border-radius:50%;right:-55px;top:-105px}.hero .ico{width:50px;height:50px;border:1px solid #ffffff80;border-radius:13px;display:grid;place-items:center;font-size:23px;margin-right:14px}.hero small{font-size:12px}.hero h1{font-size:27px;margin:2px 0}.hero p{font-size:13px;margin:3px 0 0;opacity:.9}.home{position:absolute;right:25px;z-index:2;color:#fff;text-decoration:none;border:1px solid #ffffff99;border-radius:20px;padding:8px 14px;font-size:13px}
.main{background:#fff;border-radius:0 0 18px 18px;box-shadow:0 12px 35px #245d6815;padding:25px;display:grid;grid-template-columns:285px 1fr;gap:24px}.profile{border:1px solid #dbe9eb;border-radius:15px;overflow:hidden;background:#fbfefe;height:max-content}.cover{height:92px;background:linear-gradient(130deg,#5db4be,#80cec5)}.photo{width:132px;height:150px;display:block;object-fit:cover;border-radius:14px;border:5px solid #fff;margin:-65px auto 12px;box-shadow:0 4px 15px #0002;background:#eef4f5}.profile-text{text-align:center;padding:0 18px 20px}.profile h2{font-size:21px;margin:0;color:#285863}.name-en{font-size:11px;color:#829499;margin:3px 0}.designation{display:inline-block;margin:8px 0;padding:6px 11px;border-radius:18px;background:#fff7e8;border:1px solid #efd8ae;color:#936b2c;font-size:12px}.quick{border-top:1px solid #e6eeee;margin-top:8px;padding-top:10px;text-align:left}.quick a,.quick div{display:flex;align-items:flex-start;gap:9px;padding:7px 0;color:#53737a;text-decoration:none;font-size:12px;word-break:break-word}.quick i{width:18px;color:#238695;margin-top:2px}
.content{display:grid;gap:16px}.section{border:1px solid #dce9eb;border-radius:14px;overflow:hidden;background:#fff}.section-head{height:48px;padding:0 16px;display:flex;align-items:center;gap:9px;background:#f5fbfb;border-bottom:1px solid #dce9eb;font-size:15px;font-weight:600;color:#39747d}.section-head i{color:#248795}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);padding:8px 16px 16px}.item{padding:11px 8px;border-bottom:1px dashed #e3ecee}.item:nth-last-child(-n+2){border-bottom:0}.label{display:block;font-size:10px;color:#8a999e;margin-bottom:4px}.value{font-size:13px;color:#345c65;word-break:break-word}.wide{grid-column:1/-1}.bio{padding:16px 20px;font-size:13px;line-height:1.9;color:#496970;white-space:pre-line}.back{display:inline-flex;gap:7px;align-items:center;margin-top:16px;color:#287f8b;text-decoration:none;font-size:13px}.loading{grid-column:1/-1;text-align:center;padding:90px 20px;color:#789095}.hidden{display:none!important}
@media(max-width:800px){.main{grid-template-columns:1fr}.profile{max-width:380px;width:100%;margin:auto}.hero h1{font-size:21px}.info-grid{grid-template-columns:1fr}.wide{grid-column:auto}.item:nth-last-child(-n+2){border-bottom:1px dashed #e3ecee}}@media(max-width:520px){.shell{width:96%;margin-top:10px}.hero{padding:55px 18px 20px}.home{right:15px;top:14px}.main{padding:14px}}
</style></head><body><div class="shell"><header class="hero"><div class="ico"><i class="fa-solid fa-id-card"></i></div><div><small>শিক্ষক-কর্মচারী পরিচিতি</small><h1>বিস্তারিত তথ্য</h1><p>বিদ্যালয়ের তথ্যভাণ্ডার থেকে হালনাগাদ তথ্য</p></div><a class="home" href="index.html"><i class="fa-solid fa-house"></i> হোমপেজ</a></header>
<main class="main" id="main"><div class="loading"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>তথ্য লোড হচ্ছে...</p></div></main></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=v=>v!==null&&v!==undefined&&String(v).trim()!==''?esc(v):'—';
const fmt=d=>{if(!d)return '—';try{return new Intl.DateTimeFormat('bn-BD',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00'))}catch(e){return d}};
function item(label,value,wide=false){return `<div class="item${wide?' wide':''}"><span class="label">${label}</span><span class="value">${value}</span></div>`}
async function load(){
 const id=new URLSearchParams(location.search).get('id'),main=document.getElementById('main');
 if(!id){main.innerHTML='<div class="loading">শিক্ষক/কর্মচারী নির্বাচন করা হয়নি।<br><a class="back" href="teacher-info.html">তালিকায় ফিরে যান</a></div>';return}
 try{
  const r=await fetch('/.netlify/functions/public-api?kind=staff&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();
  const t=(j.data||[]).find(x=>String(x.id)===String(id));if(!t)throw 0;
  document.title=(t.name||'শিক্ষক-কর্মচারী')+' | বিস্তারিত তথ্য';
  const img=t.image?esc(t.image):'Mamun.jpg';
  main.innerHTML=`<aside class="profile"><div class="cover"></div><img class="photo" src="${img}" alt="${esc(t.name||'')}" onerror="this.src='Mamun.jpg'"><div class="profile-text"><h2>${val(t.name)}</h2><div class="name-en">${val(t.name_en)}</div><div class="designation">${val(t.designation||t.staff_type)}</div><div class="quick">${t.phone?`<a href="tel:${esc(t.phone)}"><i class="fa-solid fa-phone"></i><span>${esc(t.phone)}</span></a>`:''}${t.email?`<a href="mailto:${esc(t.email)}"><i class="fa-solid fa-envelope"></i><span>${esc(t.email)}</span></a>`:''}${t.subject?`<div><i class="fa-solid fa-book-open"></i><span>${esc(t.subject)}</span></div>`:''}</div></div></aside>
  <div class="content">
   <section class="section"><div class="section-head"><i class="fa-regular fa-user"></i> ব্যক্তিগত তথ্য</div><div class="info-grid">
    ${item('নাম (বাংলা)',val(t.name))}${item('নাম (ইংরেজি)',val(t.name_en))}
    ${item('লিঙ্গ',val(t.gender))}${item('ধর্ম',val(t.religion))}
    ${item('জন্ম তারিখ',fmt(t.date_of_birth))}${item('রক্তের গ্রুপ',val(t.blood_group))}
    ${item('বৈবাহিক অবস্থা',val(t.marital_status))}${item('জাতীয় পরিচয়পত্র নম্বর',val(t.nid))}
    ${item('জেলা',val(t.district))}${item('উপজেলা',val(t.upazila))}
    ${item('ঠিকানা',val(t.address),true)}
   </div></section>
   <section class="section"><div class="section-head"><i class="fa-solid fa-briefcase"></i> পেশাগত ও একাডেমিক তথ্য</div><div class="info-grid">
    ${item('ধরন',val(t.staff_type))}${item('পদবি',val(t.designation))}
    ${item('বিষয়',val(t.subject))}${item('কর্মচারী/Employee ID',val(t.employee_id))}
    ${item('ইনডেক্স নম্বর',val(t.index_no))}${item('যোগদানের তারিখ',fmt(t.joining_date))}
    ${item('অভিজ্ঞতা',t.experience_years!==null&&t.experience_years!==undefined?val(t.experience_years)+' বছর':'—')}
    ${item('শিক্ষাগত যোগ্যতা',val(t.qualification),true)}
   </div></section>
   <section class="section"><div class="section-head"><i class="fa-solid fa-circle-info"></i> বিস্তারিত পরিচিতি / দায়িত্ব</div><div class="bio">${val(t.details)}</div></section>
   <a class="back" href="teacher-info.html"><i class="fa-solid fa-arrow-left"></i> শিক্ষক-কর্মচারী তালিকায় ফিরে যান</a>
  </div>`;
 }catch(e){main.innerHTML='<div class="loading"><i class="fa-solid fa-triangle-exclamation fa-2x"></i><p>এই শিক্ষক/কর্মচারীর তথ্য পাওয়া যায়নি।</p><a class="back" href="teacher-info.html">তালিকায় ফিরে যান</a></div>'}
}
load();
</script><script src="school-info.js?v=global-name-1"></script>
</body></html>
