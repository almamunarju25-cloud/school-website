<!doctype html><html lang="bn"><script>(function(){try{var s=new URLSearchParams(location.search).get('school');if(s&&/^[a-z0-9-]+$/i.test(s)){document.cookie='bhs_school='+encodeURIComponent(s.toLowerCase())+'; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin</title><link rel="stylesheet" href="fonts.css"><style>body{font-family:Kalpurush;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:35px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 5px 20px #123b5d12}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select{padding:11px;border:1px solid #ccd5df;border-radius:7px;font:inherit}label{display:grid;gap:5px}.btn{padding:11px 16px;border:0;border-radius:7px;background:#1266cf;color:#fff;font:inherit;cursor:pointer}.danger{background:#c73545}.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7edf3;padding:12px 0}.msg{color:#147a56}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{display:block}}</style><main class="wrap"><section class="card"><h1>Super Admin Dashboard</h1><p>সব স্কুল, plan ও active/suspended status পরিচালনা করুন।</p><form id="login"><label>Super Admin Password<input id="pw" type="password" required></label><button class="btn">প্রবেশ করুন</button></form><div id="msg" class="msg"></div></section><section class="card" id="app" hidden><h2>নতুন স্কুল যোগ করুন</h2><form id="add" class="grid"><label>Slug<input id="slug" required placeholder="demo-school"></label><label>বাংলা নাম<input id="bn" required></label><label>English Name<input id="en"></label><label>Admin Password<input id="ap" type="password" minlength="8" required placeholder="কমপক্ষে ৮ অক্ষরের Admin Password"></label><label>Plan<select id="plan"><option>basic</option><option>standard</option><option>premium</option></select></label><button class="btn">স্কুল সংরক্ষণ</button></form><h2>স্কুল তালিকা</h2><div id="list"></div></section></main><script>let pass='';async function api(o={}){let r=await fetch('/.netlify/functions/super-admin-api',{method:o.method||'GET',headers:{'x-super-admin-password':pass,'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}async function load(){let j=await api();app.hidden=false;list.innerHTML=(j.tenants||[]).map(x=>`<div class="row"><span><b>${x.nameBn}</b><br><small>${x.slug} · ${x.plan} · ${x.status}</small></span><span><button class="btn" onclick="status('${x.slug}','${x.status==='active'?'suspended':'active'}')">${x.status==='active'?'Suspend':'Activate'}</button></span></div>`).join('')}login.onsubmit=async e=>{e.preventDefault();pass=pw.value;try{await load();msg.textContent='সফলভাবে প্রবেশ করেছেন';}catch{msg.textContent='Password সঠিক নয়'}};add.onsubmit=async e=>{e.preventDefault();try{await api({method:'POST',body:{action:'upsertTenant',tenant:{slug:slug.value,nameBn:bn.value,nameEn:en.value,adminPassword:ap.value,plan:plan.value}}});add.reset();load()}catch(e){msg.textContent=e.message}};async function status(s,v){await api({method:'POST',body:{action:'setStatus',slug:s,status:v}});load()}</script>
