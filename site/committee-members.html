<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ব্যবস্থাপনা কমিটি | বল্লভপুর উচ্চ বিদ্যালয়</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f6;font-family:"Noto Sans Bengali","Kalpurush",sans-serif;color:#24564b}.page{width:min(1080px,94%);margin:30px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 32px #164e3d12}.hero{background:linear-gradient(120deg,#087a55,#31a97f);color:#fff;padding:27px 30px;position:relative}.hero h1{margin:3px 0;font-size:28px}.hero p{margin:0;opacity:.85;font-size:13px}.home{position:absolute;right:25px;top:31px;color:#fff;text-decoration:none;border:1px solid #ffffff80;padding:8px 14px;border-radius:20px}.content{padding:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #dbe9e4;border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 6px 18px #205f4b0c}.top{height:75px;background:#e7f5ef}.photo{width:95px;height:105px;object-fit:cover;border-radius:12px;border:4px solid #fff;margin:-47px auto 9px;background:#edf4f1}.card h3{margin:0;font-size:18px}.role{font-size:12px;color:#7c918b;margin:4px 0 12px}.btn{display:inline-block;background:#087a55;color:#fff;text-decoration:none;padding:8px 15px;border-radius:20px;font-size:12px;margin-bottom:17px}.empty{grid-column:1/-1;text-align:center;padding:70px;color:#78918b}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.home{top:12px;right:12px}.hero{padding-top:55px}}</style></head><body><main class="page"><header class="hero"><small>বিদ্যালয় পরিচালনা</small><h1 id="heading">ব্যবস্থাপনা কমিটি</h1><p>ওয়েব ম্যানেজমেন্টে সংরক্ষিত তথ্য</p><a class="home" href="index.html"><i class="fa-solid fa-house"></i> হোম</a></header><section class="content"><div class="grid" id="grid"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> তথ্য লোড হচ্ছে...</div></div></section></main><script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const type=new URLSearchParams(location.search).get('type')||'সদস্য';document.getElementById('heading').textContent=type+'বৃন্দ';document.title=type+' | ব্যবস্থাপনা কমিটি';
fetch('/.netlify/functions/public-api?kind=committee&type='+encodeURIComponent(type)+'&_='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const rows=Array.isArray(j.data)?j.data:[],g=document.getElementById('grid');if(!rows.length){g.innerHTML='<div class="empty">ওয়েব ম্যানেজমেন্টে এই বিভাগে কোনো তথ্য যোগ করা হয়নি।</div>';return}g.innerHTML=rows.map(x=>`<article class="card"><div class="top"></div><img class="photo" src="${x.image?e(x.image):'Mamun.jpg'}" onerror="this.src='Mamun.jpg'"><h3>${e(x.name||'')}</h3><div class="role">${e(x.designation||x.member_type||'')}</div><a class="btn" href="committee-member-profile.html?id=${encodeURIComponent(x.id)}&type=${encodeURIComponent(type)}">বিস্তারিত</a></article>`).join('')}).catch(()=>document.getElementById('grid').innerHTML='<div class="empty">তথ্য লোড করা যায়নি।</div>');
</script><script src="school-info.js?v=global-name-1"></script>
</body></html>
