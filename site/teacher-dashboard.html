<!doctype html><html lang="bn"><script>(function(){try{var s=new URLSearchParams(location.search).get('school');if(s&&/^[a-z0-9-]+$/i.test(s)){document.cookie='bhs_school='+encodeURIComponent(s.toLowerCase())+'; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শিক্ষক ড্যাশবোর্ড</title><link rel="stylesheet" href="fonts.css"><style>body{font-family:Kalpurush;margin:0;background:#f4f8fc;color:#173b50}.wrap{max-width:1100px;margin:25px auto;padding:0 15px}.head,.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 5px 18px #123b5d12}.head{background:#1266cf;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h3{margin-top:0;color:#1266cf}@media(max-width:700px){.grid{grid-template-columns:1fr}}button{padding:9px 15px;border:0;border-radius:7px;background:#fff;color:#1266cf;cursor:pointer}</style><main class="wrap"><section class="head"><h1 id="name">শিক্ষক ড্যাশবোর্ড</h1><p id="meta">তথ্য লোড হচ্ছে...</p><button onclick="logout()">Logout</button></section><section class="grid"><article class="card"><h3>আমার ক্লাস</h3><div id="classes">তথ্য নেই</div></article><article class="card"><h3>শিক্ষার্থী তথ্য</h3><div id="students">তথ্য নেই</div></article><article class="card"><h3>রুটিন</h3><div id="routines">তথ্য নেই</div></article></section><section class="card"><h3>উপস্থিতি সংরক্ষণ</h3><form id="af"><input id="ac" placeholder="Class" required><input id="ad" type="date" required><textarea id="ar" placeholder="JSON records: [{studentId,status}]" required></textarea><button>সংরক্ষণ</button></form></section><section class="card"><h3>নম্বর সংরক্ষণ</h3><form id="mf"><input id="mc" placeholder="Class" required><input id="me" placeholder="Exam" required><input id="ms" placeholder="Subject"><textarea id="mr" placeholder="JSON records: [{studentId,marks}]" required></textarea><button>নম্বর সংরক্ষণ</button></form><p id="msg"></p></section></main><script>async function load(){let r=await fetch('/.netlify/functions/role-api',{credentials:'same-origin'});if(!r.ok){location.href='teacher-login.html';return}let d=await r.json();name.textContent=d.user.name||'শিক্ষক ড্যাশবোর্ড';meta.textContent='বিষয়: '+(d.user.subject||'নির্ধারিত নয়');classes.textContent=JSON.stringify(d.user.classes||[]);students.textContent=(d.students||[]).length+'টি student record';routines.textContent=(d.routines||[]).length+'টি routine'}af.onsubmit=async e=>{e.preventDefault();try{let records=JSON.parse(ar.value),r=await fetch('/.netlify/functions/role-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'attendance',className:ac.value,date:ad.value,records})});msg.textContent=r.ok?'উপস্থিতি সংরক্ষণ হয়েছে':'সংরক্ষণ ব্যর্থ';}catch{msg.textContent='JSON format ভুল হয়েছে'}};mf.onsubmit=async e=>{e.preventDefault();try{let records=JSON.parse(mr.value),r=await fetch('/.netlify/functions/role-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'marks',className:mc.value,exam:me.value,subject:ms.value,records})});msg.textContent=r.ok?'নম্বর সংরক্ষণ হয়েছে':'সংরক্ষণ ব্যর্থ';}catch{msg.textContent='JSON format ভুল হয়েছে'}};async function logout(){await fetch('/.netlify/functions/auth?action=logout');location.href='teacher-login.html'}load()</script>
