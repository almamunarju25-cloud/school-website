<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>কমিটি সদস্যের বিস্তারিত | বল্লভপুর উচ্চ বিদ্যালয়</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;font-family:"Noto Sans Bengali","Kalpurush",sans-serif;color:#244f4b}.wrap{width:min(980px,94%);margin:30px auto}.hero{background:linear-gradient(120deg,#087a55,#29a479);color:#fff;padding:28px 32px;border-radius:18px 18px 0 0;position:relative}.hero small{opacity:.85}.hero h1{margin:5px 0 0;font-size:28px}.home{position:absolute;right:25px;top:32px;color:#fff;text-decoration:none;border:1px solid #ffffff80;padding:8px 14px;border-radius:20px;font-size:13px}.main{background:#fff;min-height:440px;border-radius:0 0 18px 18px;box-shadow:0 12px 35px #174c3d16;padding:28px;display:grid;grid-template-columns:270px 1fr;gap:25px}.profile{border:1px solid #d9e8e3;border-radius:15px;overflow:hidden;height:max-content}.cover{height:90px;background:linear-gradient(120deg,#dff4eb,#9edac5)}.photo{width:132px;height:145px;object-fit:cover;border-radius:14px;border:5px solid #fff;display:block;margin:-62px auto 12px;background:#edf5f2;box-shadow:0 4px 14px #0002}.ptext{text-align:center;padding:0 17px 20px}.ptext h2{margin:0;font-size:21px}.badge{display:inline-block;background:#e8f7f0;color:#087a55;border:1px solid #cceade;border-radius:20px;padding:6px 12px;margin:9px 0;font-size:12px}.phone{display:flex;justify-content:center;gap:7px;color:#267567;text-decoration:none;font-size:13px;border-top:1px solid #edf2f0;padding-top:12px}.section{border:1px solid #dce9e5;border-radius:14px;overflow:hidden;margin-bottom:16px}.head{padding:14px 17px;background:#f4fbf8;border-bottom:1px solid #dce9e5;font-weight:600;color:#237462}.info{padding:10px 18px}.row{padding:11px 4px;border-bottom:1px dashed #e1ebe7}.row:last-child{border-bottom:0}.label{font-size:11px;color:#8a9b96;display:block;margin-bottom:4px}.value{font-size:14px}.bio{padding:18px;line-height:1.9;white-space:pre-line;color:#496b64}.loading{grid-column:1/-1;text-align:center;padding:80px;color:#78918b}.back{color:#087a55;text-decoration:none;font-size:13px}@media(max-width:700px){.main{grid-template-columns:1fr}.profile{max-width:360px;width:100%;margin:auto}.home{top:15px;right:15px}.hero{padding-top:60px}}
</style></head><body><div class="wrap"><header class="hero"><small>বিদ্যালয় ব্যবস্থাপনা কমিটি</small><h1 id="title">সদস্যের বিস্তারিত তথ্য</h1><a class="home" href="index.html"><i class="fa-solid fa-house"></i> হোমপেজ</a></header><main class="main" id="main"><div class="loading"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>তথ্য লোড হচ্ছে...</p></div></main></div>
<script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const q=new URLSearchParams(location.search),id=q.get('id'),type=q.get('type')||'',main=document.getElementById('main');if(!id){main.innerHTML='<div class="loading">সদস্য নির্বাচন করা হয়নি।</div>';return}
try{const r=await fetch('/.netlify/functions/public-api?kind=committee&id='+encodeURIComponent(id)+'&type='+encodeURIComponent(type)+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json(),x=j.data;if(!x)throw 0;
document.getElementById('title').textContent=(x.member_type||'সদস্য')+' — বিস্তারিত তথ্য';document.title=(x.name||'কমিটি সদস্য')+' | বিস্তারিত';
main.innerHTML=`<aside class="profile"><div class="cover"></div><img class="photo" src="${x.image?e(x.image):'Mamun.jpg'}" onerror="this.src='Mamun.jpg'"><div class="ptext"><h2>${e(x.name||'')}</h2><span class="badge">${e(x.member_type||'সদস্য')}</span>${x.phone?`<a class="phone" href="tel:${e(x.phone)}"><i class="fa-solid fa-phone"></i>${e(x.phone)}</a>`:''}</div></aside><div><section class="section"><div class="head"><i class="fa-regular fa-id-card"></i> পরিচিতি</div><div class="info"><div class="row"><span class="label">নাম</span><span class="value">${e(x.name||'—')}</span></div><div class="row"><span class="label">পদবি / পরিচয়</span><span class="value">${e(x.designation||x.member_type||'—')}</span></div><div class="row"><span class="label">মোবাইল নম্বর</span><span class="value">${e(x.phone||'—')}</span></div></div></section><section class="section"><div class="head"><i class="fa-solid fa-circle-info"></i> বিস্তারিত তথ্য</div><div class="bio">${e(x.details||'কোনো বিস্তারিত তথ্য দেওয়া হয়নি।')}</div></section><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরে যান</a></div>`;
}catch(err){main.innerHTML='<div class="loading"><i class="fa-solid fa-triangle-exclamation fa-2x"></i><p>এই সদস্যের তথ্য পাওয়া যায়নি।</p><a class="back" href="index.html">হোমপেজে ফিরে যান</a></div>'}}
load();
</script><script src="school-info.js?v=global-name-1"></script>
</body></html>
