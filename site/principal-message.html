<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রধান শিক্ষকের বাণী | বল্লভপুর উচ্চ বিদ্যালয়</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  *{box-sizing:border-box}
  body.principal-page{margin:0;padding:18px 0 34px;background:#f7f7f7;font-family:"Noto Sans Bengali","SolaimanLipi","Kalpurush",Arial,sans-serif;color:#294b56;}
  .principal-shell{width:min(1240px,calc(100% - 32px));margin:0 auto;background:#fff;box-shadow:0 4px 22px rgba(30,79,88,.08);}
  .principal-hero{min-height:90px;padding:16px 22px;background:linear-gradient(105deg,#397f87,#6db7c1);color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;}
  .principal-hero:before,.principal-hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%;}
  .principal-hero:before{width:118px;height:118px;right:-22px;top:-70px}.principal-hero:after{width:72px;height:72px;right:58px;bottom:-52px}
  .principal-icon{width:42px;height:42px;border:1px solid rgba(255,255,255,.55);border-radius:9px;display:grid;place-items:center;margin-right:12px;font-size:21px;flex:0 0 42px;}
  .principal-kicker{font-size:10px;margin-bottom:2px;opacity:.92}.principal-hero h1{margin:0;font-size:22px;font-weight:500;line-height:1.2}.principal-hero p{margin:5px 0 0;font-size:10px;opacity:.92}
  .home-header-btn{position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:3;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid rgba(255,255,255,.65);border-radius:16px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:11px}.home-header-btn:hover{background:rgba(255,255,255,.28)}
  .principal-content{padding:20px;display:grid;grid-template-columns:155px 1fr;gap:18px;background:#fff;}
  .principal-profile{border:1px solid #dce9eb;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 5px 17px rgba(24,88,99,.10);text-align:center;min-height:240px;}
  .principal-profile-top{height:74px;background:linear-gradient(135deg,#6dbbc3,#4a9ba5);}
  .principal-photo-wrap{width:80px;height:80px;margin:-42px auto 8px;padding:4px;background:#fff;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.15)}
  .principal-photo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .principal-profile h2{font-size:13px;font-weight:500;margin:0 8px 4px;color:#31545e}.principal-profile .role{font-size:10px;color:#69858c;margin-bottom:8px}.principal-badge{display:inline-flex;gap:4px;align-items:center;padding:4px 8px;border:1px solid #efd8ae;border-radius:16px;background:#fff9ed;color:#866d35;font-size:9px}.principal-rule{height:1px;background:#e8eeee;margin:13px 12px 9px}.principal-school{font-size:9px;line-height:1.75;color:#61777d;padding:0 8px 14px}
  .principal-message{border:1px solid #d8e8eb;border-radius:9px;min-height:240px;background:linear-gradient(180deg,#fff,#fbfefe);box-shadow:0 4px 14px rgba(28,91,100,.06);overflow:hidden;}
  .message-head{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #d8e8eb;color:#47757e;font-size:13px}.quote-mark{width:23px;height:23px;border-radius:6px;background:#fff8e9;color:#d99a36;display:grid;place-items:center;font-size:11px}
  .message-body{padding:12px 16px 18px;font-size:12px;line-height:2;text-align:justify;color:#3a5961}.message-body p{margin:0 0 9px}.message-body p:first-child:first-letter{font-size:35px;float:left;line-height:.8;padding:7px 5px 0 0;color:#278596;font-family:Georgia,serif}.message-body strong{color:#277b86}
  .back-home{display:inline-flex;align-items:center;gap:6px;margin:0 20px 20px;color:#397f87;font-size:11px;text-decoration:none}.back-home:hover{text-decoration:underline}
  @media(max-width:700px){body.principal-page{padding-top:10px}.principal-shell{width:calc(100% - 18px)}.home-header-btn{position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:3;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid rgba(255,255,255,.65);border-radius:16px;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;font-size:11px}.home-header-btn:hover{background:rgba(255,255,255,.28)}
  .principal-content{grid-template-columns:1fr;padding:12px}.principal-profile{max-width:280px;width:100%;margin:auto}.principal-hero h1{font-size:19px}.message-body{font-size:11px}}

/* GLOBAL_REQUIRED_STAR_INLINE */
label em, label .required, label .required-star, .form-label em, .form-label .required, .form-label .required-star {
  display:inline !important;
  position:static !important;
  float:none !important;
  margin:0 0 0 3px !important;
  padding:0 !important;
  vertical-align:baseline !important;
  white-space:nowrap !important;
  color:#dc2626;
  font-style:normal;
}
</style>

</head>
<body class="principal-page">
<div class="principal-shell">
  <header class="principal-hero">
    <div class="principal-icon"><i class="fa-solid fa-graduation-cap"></i></div>
    <div>
      <div class="principal-kicker">বিদ্যালয় প্রশাসনের পক্ষ থেকে</div>
      <h1>প্রধান শিক্ষকের বাণী</h1>
      <p>শিক্ষাই জাতির মেরুদণ্ড — শিক্ষা, শৃঙ্খলা ও মানবিক মূল্যবোধে আলোকিত আগামী</p>
    </div>
  <a class="home-header-btn" href="index.html"><i class="fa-solid fa-house"></i> হোমপেজ</a></header>

  <main class="principal-content">
    <aside class="principal-profile">
      <div class="principal-profile-top"></div>
      <div class="principal-photo-wrap"><img id="leaderPhoto" src="Mamun.jpg" alt="প্রধান শিক্ষক"></div>
      <h2 id="leaderName">তথ্য লোড হচ্ছে...</h2>
      <div class="role" id="leaderRole">প্রধান শিক্ষক</div>
      <span class="principal-badge"><i class="fa-solid fa-award"></i> <span id="leaderBadge">প্রধান শিক্ষক</span></span>
      <div class="principal-rule"></div>
      <div class="principal-school" id="leaderSchool">বল্লভপুর উচ্চ বিদ্যালয়</div>
    </aside>

    <section class="principal-message">
      <div class="message-head"><span>শুভেচ্ছা ও বাণী</span><span class="quote-mark"><i class="fa-solid fa-quote-right"></i></span></div>
      <div class="message-body" id="leaderMessage"><p>তথ্য লোড হচ্ছে...</p></div>
    </section>
  </main>
  
</div>

<script>
(async function(){
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const paragraphs=s=>String(s||'').split(/\n{2,}|\r?\n/).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');
 try{
  const r=await fetch('/.netlify/functions/public-api?kind=leadership&_='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0;
  const j=await r.json(), x=j.headteacher||{};
  leaderPhoto.src=x.image||'Mamun.jpg'; leaderPhoto.onerror=()=>leaderPhoto.src='Mamun.jpg';
  leaderName.textContent=x.name||'প্রধান শিক্ষকের তথ্য যোগ করা হয়নি';
  leaderRole.textContent=x.designation||'প্রধান শিক্ষক';
  leaderBadge.textContent=x.designation||'প্রধান শিক্ষক';
  const s=j.school||{};
  leaderSchool.innerHTML=esc(s.name||'বল্লভপুর উচ্চ বিদ্যালয়')+(s.address?'<br>'+esc(s.address):'');
  leaderMessage.innerHTML=x.details?paragraphs(x.details):'<p>ওয়েব ম্যানেজমেন্টে প্রধান শিক্ষকের বাণী এখনো যোগ করা হয়নি।</p>';
 }catch(e){
  leaderMessage.innerHTML='<p>তথ্য লোড করা যায়নি। PHP/MySQL সার্ভারে পেজটি চালু করুন।</p>';
 }
})();
</script>
<script src="school-info.js?v=global-name-1"></script>
</body>
</html>
