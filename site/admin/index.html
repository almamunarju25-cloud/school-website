<script>
const API='/.netlify/functions/admin-api',AUTH='/.netlify/functions/auth',UPLOAD='/.netlify/functions/upload';let DATA=null,current='dashboard';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const media=v=>typeof v==='string'?v:(v&&typeof v==='object'?(v.url||''):''); const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.status===401){location.reload();throw Error('unauthorized')}const j=await r.json();if(!r.ok)throw Error(j.error||'Save failed');DATA=j.data||DATA;return j}
async function load(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('load');DATA=await r.json();updateHeader();render()}
async function uploadFile(file){if(!file)return null;const fd=new FormData();fd.append('file',file);const r=await fetch(UPLOAD,{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.error||'Upload failed');return {key:j.key,url:j.url,name:file.name,type:file.type}}
function updateHeader(){if(!DATA)return;$('#headerSchool').textContent=DATA.school?.nameBn||DATA.school?.school_name_bn||'বিদ্যালয়';$('#headerSchoolEn').textContent=DATA.school?.nameEn||DATA.school?.school_name_en||''}
function banner(eyebrow,title,desc,count=''){return `<div class="page-banner blue"><div><small>${esc(eyebrow)}</small><h2>${esc(title)}</h2><p>${esc(desc)}</p></div>${count?`<b>${esc(count)}</b>`:''}</div>`}
function success(text='তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে'){document.getElementById('modalRoot').innerHTML=`<div class="global-feedback-overlay" data-global-feedback><div class="global-feedback-box"><div class="global-feedback-check"><i class="fa-solid fa-check"></i></div><h3>আপডেট সম্পন্ন</h3><p>${esc(text)}</p><button class="global-feedback-ok" type="button">ঠিক আছে</button></div></div>`}
function confirmDelete(cb){document.getElementById('modalRoot').innerHTML=`<div class="global-delete-confirm"><div class="global-delete-box"><div class="global-delete-icon"><i class="fa-solid fa-trash"></i></div><h3>তথ্য ডিলেট করবেন?</h3><p>ডিলেট করলে নির্বাচিত তথ্যটি স্থায়ীভাবে মুছে যাবে।</p><div class="global-delete-actions"><button class="global-delete-cancel">বাতিল</button><button class="global-delete-confirm-btn">ডিলেট করুন</button></div></div></div>`;document.querySelector('.global-delete-cancel').onclick=()=>$('#modalRoot').innerHTML='';document.querySelector('.global-delete-confirm-btn').onclick=async()=>{await cb();$('#modalRoot').innerHTML=''}}
function required(t){return `<span class="required-title">${t} <em>*</em></span>`}
function fld(name,label,val='',type='text',full=false,opts=[]){let ctl;if(type==='textarea')ctl=`<textarea name="${name}" rows="4">${esc(val)}</textarea>`;else if(type==='select')ctl=`<select name="${name}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;else ctl=`<input type="${type}" name="${name}" value="${esc(val)}">`;return `<label class="${full?'full':''}">${label}${ctl}</label>`}
function fileFld(name,label,val='',requiredFlag=false,full=true,accept='image/*,.pdf'){const u=media(val),isImg=String(accept).includes('image');return `<label class="${full?'full':''} file-field">${requiredFlag?required(label):label}<div class="file-drop-zone" data-file-zone><input type="file" name="${name}" accept="${accept}"><div class="file-drop-hint"><i class="fa-solid fa-cloud-arrow-up"></i><span>ছবি/ফাইল এখানে Drag & Drop করুন অথবা ক্লিক করে নির্বাচন করুন</span></div><div class="image-preview ${u?'has-file':''}" data-preview>${u&&isImg?`<img src="${esc(u)}">`:''}<span class="file-name">${u?'বর্তমান ফাইল':''}</span></div></div></label>`}
function listTable(rows,cols,key){return `<div class="list-toolbar"><div class="left">প্রতি পেজে <select class="global-page-size"><option>10</option><option>20</option><option>50</option></select> টি</div><div class="right">খুঁজুন: <input class="table-search global-list-search" type="search"></div></div><div class="table-scroll"><table class="admin-table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>অ্যাকশন</th></tr></thead><tbody>${rows.map(r=>`<tr data-search="${esc(Object.values(r).map(x=>typeof x==='string'?x:'').join(' ').toLowerCase())}">${cols.map(c=>`<td>${c[2]?c[2](r[c[0]],r):esc(r[c[0]]??'')}</td>`).join('')}<td><button class="btn tiny edit" data-edit="${key}" data-id="${esc(r.id)}"><i class="fa-solid fa-pen"></i></button> <button class="btn tiny danger" data-del="${key}" data-id="${esc(r.id)}"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div><div class="global-table-pager"><span class="gp-info"></span><span class="gp-buttons"><button class="gp-prev">আগে</button><span class="gp-current">১</span><button class="gp-next">পরবর্তী</button></span></div>`}
function activatePager(){document.querySelectorAll('.table-card').forEach(card=>{const table=card.querySelector('table'),search=card.querySelector('.global-list-search'),size=card.querySelector('.global-page-size'),prev=card.querySelector('.gp-prev'),next=card.querySelector('.gp-next'),cur=card.querySelector('.gp-current'),info=card.querySelector('.gp-info');if(!table||!prev)return;let page=1;const all=[...table.tBodies[0].rows];function draw(){const q=(search?.value||'').toLowerCase();const m=all.filter(r=>r.dataset.search.includes(q));const ps=+(size?.value||10),pages=Math.max(1,Math.ceil(m.length/ps));page=Math.min(page,pages);all.forEach(r=>r.style.display='none');m.slice((page-1)*ps,page*ps).forEach(r=>r.style.display='');const a=m.length?(page-1)*ps+1:0,b=Math.min(page*ps,m.length);info.textContent=`${bn(m.length)}টির মধ্যে ${bn(a)}-${bn(b)} দেখানো হচ্ছে`;cur.textContent=bn(page);prev.disabled=page<=1;next.disabled=page>=pages}search&&search.addEventListener('input',()=>{page=1;draw()});size&&size.addEventListener('change',()=>{page=1;draw()});prev.onclick=()=>{page--;draw()};next.onclick=()=>{page++;draw()};draw()})}
function dashboard(){const counts=[['স্লাইডার',(DATA.slides||[]).length],['নোটিশ',(DATA.notices||[]).length],['শিক্ষক/কর্মচারী',(DATA.staff||[]).length],['গ্যালারি',(DATA.gallery||[]).length]];return banner('DASHBOARD','Dashboard','ওয়েবসাইট ম্যানেজমেন্টের সারসংক্ষেপ')+`<div class="dashboard-cards">${counts.map(x=>`<div><b>${bn(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div>`}
function school(){const s=DATA.school||{};return banner('SCHOOL INFORMATION','বিদ্যালয়ের তথ্য','বিদ্যালয়ের নাম, ঠিকানা, যোগাযোগ ও পরিচিতি এক জায়গা থেকে পরিচালনা করুন')+`<form id="schoolForm"><div class="school-form-grid"><section class="form-card"><div class="card-title"><i class="fa-solid fa-language"></i><div><b>বাংলা তথ্য</b><small>বিদ্যালয়ের বাংলা তথ্য পূরণ করুন</small></div></div><div class="form-grid">${fld('nameBn',required('বিদ্যালয়ের নাম (বাংলা)'),s.nameBn||s.school_name_bn||'')}${fld('upazilaBn',required('উপজেলা (বাংলা)'),s.upazilaBn||'')}${fld('postOfficeBn',required('পোস্ট অফিস (বাংলা)'),s.postOfficeBn||'')}${fld('districtBn',required('জেলা (বাংলা)'),s.districtBn||'', 'text',true)}${fld('phoneHeadteacher',required('প্রধান শিক্ষকের ফোন'),s.phoneHeadteacher||s.phone||'')}${fld('phoneOffice',required('অফিস সহকারীর ফোন'),s.phoneOffice||'')}${fld('descriptionBn','বিদ্যালয় সম্পর্কে সংক্ষিপ্ত বর্ণনা',s.descriptionBn||'','textarea',true)}${fileFld('schoolLogo','বিদ্যালয়ের লোগো',s.schoolLogoObj||s.schoolLogo,true)}${fileFld('boardLogo','শিক্ষা বোর্ডের লোগো',s.boardLogoObj||s.boardLogo,true)}</div></section><section class="form-card"><div class="card-title"><i class="fa-solid fa-language"></i><div><b>English Information</b><small>Enter the school's English information</small></div></div><div class="form-grid">${fld('nameEn',required('School Name (English)'),s.nameEn||'')}${fld('postOfficeEn',required('Post Office (English)'),s.postOfficeEn||'')}${fld('upazilaEn',required('Upazila (English)'),s.upazilaEn||'')}${fld('districtEn',required('District (English)'),s.districtEn||'')}${fld('eiin',required('EIIN'),s.eiin||'')}${fld('schoolCode',required('School Code'),s.schoolCode||'')}${fld('established',required('Established Year'),s.established||'')}${fld('email',required('Email'),s.email||'','email')}${fld('facebook','Facebook Page Link',s.facebook||'','text',true)}${fld('youtube','YouTube Channel Link',s.youtube||'','text',true)}${fld('institutionType',required('প্রতিষ্ঠানের ধরন'),s.institutionType||'','select',true,['','মাধ্যমিক বিদ্যালয়','উচ্চ বিদ্যালয়','স্কুল এন্ড কলেজ'])}</div></section><div class="form-actions full-width"><span>সংরক্ষণ করলে ওয়েবসাইটের সংশ্লিষ্ট তথ্য আপডেট হবে।</span><button class="btn primary"><i class="fa-solid fa-check"></i> তথ্য সংরক্ষণ করুন</button></div></div></form>`}
const schemas={
slides:{title:'স্লাইডার ব্যবস্থাপনা',ey:'SLIDER MANAGEMENT',desc:'ওয়েবসাইটের হোমপেজ স্লাইডারের ছবি ও তথ্য পরিচালনা করুন',fields:[['title','ছবির নাম','text',1],['image','ছবি নির্বাচন','file',1],['badge','ছোট ব্যাজ'],['description','সংক্ষিপ্ত বর্ণনা','textarea'],['sort_order','ক্রম','number']]},
notices:{title:'নোটিশ ব্যবস্থাপনা',ey:'NOTICE MANAGEMENT',desc:'সকল নোটিশ যোগ, আপডেট ও ডিলেট করুন',fields:[['title','নোটিশের শিরোনাম','text',1],['publish_date','প্রকাশের তারিখ','date',1],['file','নোটিশের ফাইল','file',1]]},
holidays:{title:'ছুটির নোটিশ',ey:'HOLIDAY NOTICE',desc:'বিদ্যালয়ের ছুটির নোটিশ পরিচালনা করুন',fields:[['title','নোটিশের শিরোনাম','text',1],['start_date','ছুটি শুরুর তারিখ','date',1],['end_date','ছুটি শেষের তারিখ','date'],['description','বিবরণ','textarea'],['file','নোটিশের ফাইল','file']]},
history:{title:'বিদ্যালয়ের ইতিহাস',ey:'SCHOOL HISTORY',desc:'বিদ্যালয়ের ইতিহাস যোগ ও আপডেট করুন',fields:[['history_text','স্কুলের ইতিহাস','textarea',1],['sort_order','ক্রম','number']]},

function enableFilePreviews(){document.querySelectorAll('[data-file-zone]').forEach(zone=>{const input=zone.querySelector('input[type=file]'),preview=zone.querySelector('[data-preview]'),hint=zone.querySelector('.file-drop-hint');if(!input||!preview)return;const show=file=>{if(!file)return;preview.classList.add('has-file');preview.innerHTML='';if(file.type&&file.type.startsWith('image/')){const img=document.createElement('img');img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);preview.appendChild(img)}const span=document.createElement('span');span.className='file-name';span.textContent=file.name;preview.appendChild(span);if(hint)hint.style.display='none'};input.addEventListener('change',()=>show(input.files&&input.files[0]));['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('dragging')}));['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('dragging')}));zone.addEventListener('drop',e=>{const files=e.dataTransfer&&e.dataTransfer.files;if(!files||!files.length)return;const dt=new DataTransfer();dt.items.add(files[0]);input.files=dt.files;show(files[0])})})}
function render(){let h='';switch(current){case'dashboard':h=dashboard();break;case'school':h=school();break;case'slides':case'notices':case'holidays':case'history':case'merit':case'gallery':case'staff':h=crud(current);break;case'branches':h=simpleListSection('branches','শাখা ব্যবস্থাপনা','বিদ্যালয়ের অনুমোদিত/চলমান শাখাগুলো নির্বাচন, সংরক্ষণ ও মুছে ফেলুন',[['name','শাখার নাম','text',1]],'branches');break;case'classes':h=simpleListSection('classes','শ্রেণি ব্যবস্থাপনা','৬ষ্ঠ-৮ম শ্রেণিতে শাখা এবং ৯ম-১০ম শ্রেণিতে বিভাগ নির্বাচন করে সংরক্ষণ করুন',[['name','শ্রেণি','select',1,['ষষ্ঠ','সপ্তম','অষ্টম','নবম','দশম']],['branch','শাখা'],['section','বিভাগ']],'classes');break;case'subjects':h=simpleListSection('subjects','বিষয় ব্যবস্থাপনা','বিষয় নাম, Subject ID এবং Subject Code পরিচালনা করুন',[['name','বিষয় নাম (SNAME)','text',1],['subject_id','Subject ID'],['code','Subject Code (SCODE)'],['name_en','ইংরেজি বিষয় নাম']],'subjects');break;case'students':h=students();break;case'routine':h=routine();break;case'permission':h=documents('permission','পাঠদানের অনুমতি পত্র');break;case'recognition':h=documents('recognition','একাডেমিক স্বীকৃতি');break;case'first_mpo':h=documents('first_mpo','প্রথম এমপিও');break;case'branch_info':h=documents('branch_info','শাখা তথ্য');break;case'other':h=documents('other','অন্যান্য তথ্য');break;case'president':h=committee('সভাপতি','সভাপতির তথ্য যোগ করুন');break;case'secretary':h=committee('সদস্য সচিব','সদস্য সচিবের তথ্য যোগ');break;case'guardian':h=committee('অভিভাবক সদস্য','অভিভাবক সদস্য যোগ করুন');break;case'member':h=committee('সদস্য','সদস্য যোগ করুন');break;case'headteacher':h=headteacher();break;case'facebook':h=social('facebook');break;case'youtube':h=social('youtube');break;}$('#content').innerHTML=h;bind();enableFilePreviews();activatePager();updateHeader()}

function editItem(collection,id){let rows=DATA[collection]||[];let x=rows.find(r=>String(r.id)===String(id));if(!x)return;if(collection==='committee'){const form=$('#committeeForm');for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}form.scrollIntoView({behavior:'smooth'});return}if(collection==='documents'){const form=$('#docForm');for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}form.scrollIntoView({behavior:'smooth'});return}if(collection==='routines'){const form=$('#routineForm');form.elements.id.value=x.id;form.elements.class_name.value=x.class_name;refreshGroups(x.group);form.elements.day_name.value=x.day_name;(x.periods||[]).forEach((v,i)=>form.elements['p'+i].value=v||'');form.scrollIntoView({behavior:'smooth'});return}const form=$('#crudForm')||$('#genericForm');if(!form)return;for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}form.scrollIntoView({behavior:'smooth'})}
function bind(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete(()=>deleteItem(b.dataset.del,b.dataset.id)));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit,b.dataset.id));$('#modalRoot').onclick=e=>{if(e.target.closest('.global-feedback-ok'))$('#modalRoot').innerHTML=''};
const sf=$('#schoolForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();const v=getFormObj(sf);for(const n of ['schoolLogo','boardLogo']){const file=sf.elements[n].files[0];if(file){const up=await uploadFile(file);v[n]=up.url;v[n+'Obj']=up}else{v[n]=DATA.school?.[n]||'';v[n+'Obj']=DATA.school?.[n+'Obj']||null}}v.phone=v.phoneHeadteacher||DATA.school?.phone||'';v.address=[v.postOfficeBn&&('পোস্ট: '+v.postOfficeBn),v.upazilaBn&&('উপজেলা: '+v.upazilaBn),v.districtBn&&('জেলা: '+v.districtBn)].filter(Boolean).join(', ');v.shortAddress=[v.upazilaBn,v.districtBn].filter(Boolean).join(', ');await call({action:'saveSchool',value:v});success('বিদ্যালয়ের তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()};
const cf=$('#crudForm');if(cf){$('#resetCrud').onclick=()=>resetForm(cf);cf.onsubmit=async e=>{e.preventDefault();const key=cf.dataset.key,item=getFormObj(cf),old=(DATA[key]||[]).find(x=>String(x.id)===String(item.id));for(const f of schemas[key].fields){if(f[2]==='file'){const file=cf.elements[f[0]].files[0];if(file){const up=await uploadFile(file);item[f[0]]=up.url;item[f[0]+'_meta']=up}else if(old)item[f[0]]=media(old[f[0]])}}item.sort_order=Number(item.sort_order||0);item.is_active=1;await call({action:'upsert',collection:key,item});success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const gf=$('#genericForm');if(gf){$('#resetGeneric').onclick=()=>resetForm(gf);gf.onsubmit=async e=>{e.preventDefault();const item=getFormObj(gf);item.is_active=1;await call({action:'upsert',collection:gf.dataset.collection,item});if(gf.dataset.collection==='branches'||gf.dataset.collection==='classes')await syncClassGroups();success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const df=$('#docForm');if(df){$('#resetDoc').onclick=()=>resetForm(df);df.onsubmit=async e=>{e.preventDefault();const item=getFormObj(df),old=(DATA.documents||[]).find(x=>String(x.id)===String(item.id));item.doc_type=df.dataset.type;const file=df.elements.file.files[0];if(file){const up=await uploadFile(file);item.file=up.url;item.file_meta=up}else if(old)item.file=media(old.file);item.is_active=1;await call({action:'upsert',collection:'documents',item});success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const cm=$('#committeeForm');if(cm){$('#resetCommittee').onclick=()=>resetForm(cm);cm.onsubmit=async e=>{e.preventDefault();const item=getFormObj(cm),old=(DATA.committee||[]).find(x=>String(x.id)===String(item.id));item.member_type=cm.dataset.type;const file=cm.elements.image.files[0];if(file){const up=await uploadFile(file);item.image=up.url;item.image_meta=up}else if(old)item.image=media(old.image);item.sort_order=Number(item.sort_order||0);item.is_active=1;await call({action:'upsert',collection:'committee',item});success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const hf=$('#headForm');if(hf)hf.onsubmit=async e=>{e.preventDefault();const v=getFormObj(hf),file=hf.elements.image.files[0];if(file){const up=await uploadFile(file);v.image=up.url;v.image_meta=up}else v.image=media(DATA.headteacher?.image);v.is_headteacher=1;await call({action:'saveHeadteacher',value:v});success('প্রধান শিক্ষকের তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()};
const st=$('#studentsForm');if(st)st.onsubmit=async e=>{e.preventDefault();const rows=[...st.querySelectorAll('tbody tr')].map(tr=>{const x={className:tr.dataset.class};['total','male','female','muslim','hindu','christian','buddhist','other'].forEach(k=>x[k]=Number(tr.querySelector(`[name="${k}"]`).value||0));return x});await call({action:'replace',collection:'students',value:rows});success('শিক্ষার্থীর তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()};
const rf=$('#routineForm');if(rf){refreshGroups();rf.elements.class_name.onchange=()=>refreshGroups();$('#resetRoutine').onclick=()=>{resetForm(rf);refreshGroups()};rf.onsubmit=async e=>{e.preventDefault();const v=getFormObj(rf),item={id:v.id,class_name:v.class_name,group:v.group,branch_name:v.group,day_name:v.day_name,periods:Array.from({length:8},(_,i)=>v['p'+i]||''),is_active:1};await call({action:'upsert',collection:'routines',item});success('রুটিন সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const soc=$('#socialForm');if(soc)soc.onsubmit=async e=>{e.preventDefault();const kind=soc.dataset.kind,value={...(DATA.school||{}),[kind]:soc.elements.url.value};await call({action:'saveSchool',value});success('লিংক সফলভাবে আপডেট হয়েছে');render()}}
function refreshGroups(wanted=''){const f=$('#routineForm');if(!f)return;const g=DATA.classGroups?.[f.elements.class_name.value]||[],s=f.elements.group;s.innerHTML=g.map(x=>`<option>${esc(x)}</option>`).join('');if(wanted&&g.includes(wanted))s.value=wanted}
async function syncClassGroups(){const groups={'ষষ্ঠ':[],'সপ্তম':[],'অষ্টম':[],'নবম':[],'দশম':[]},branches=DATA.branches||[];for(const c of DATA.classes||[]){if(['ষষ্ঠ','সপ্তম','অষ্টম'].includes(c.name)){const g=c.branch||'';if(g&&!groups[c.name].includes(g))groups[c.name].push(g)}else if(['নবম','দশম'].includes(c.name)){const g=c.section||'';if(g&&!groups[c.name].includes(g))groups[c.name].push(g)}}if(!(DATA.classes||[]).length){for(const c of ['ষষ্ঠ','সপ্তম','অষ্টম'])groups[c]=branches.map(b=>b.name).filter(Boolean)}await call({action:'saveClassGroups',value:groups})}
async function logout(){await fetch(AUTH+'?action=logout');location.reload()}$('#logoutSide').onclick=logout;$('#logoutMenu').onclick=e=>{e.preventDefault();logout()};$('#userBtn').onclick=e=>{e.stopPropagation();$('#userMenu').classList.toggle('show')};document.addEventListener('click',()=>$('#userMenu')?.classList.remove('show'));
$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const j=await r.json();if(!r.ok){$('#loginMsg').innerHTML=`<div class="err">${j.error==='admin_password_not_configured'?'ADMIN_PASSWORD সেট করা হয়নি।':'Password সঠিক নয়।'}</div>`;return}location.reload()};
(async()=>{const r=await fetch(AUTH+'?action=me',{cache:'no-store'}),j=await r.json();if(j.authenticated){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');await load();nav('dashboard')}})();
</script></body></html>
