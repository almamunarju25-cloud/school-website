function required(t){return `<span class="required-title">${t} <em>*</em></span>`}
function fld(name,label,val='',type='text',full=false,opts=[]){let ctl;if(type==='textarea')ctl=`<textarea name="${name}" rows="4">${esc(val)}</textarea>`;else if(type==='select')ctl=`<select name="${name}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;else ctl=`<input type="${type}" name="${name}" value="${esc(val)}">`;return `<label class="${full?'full':''}">${label}${ctl}</label>`}
function fileFld(name,label,val='',requiredFlag=false,full=true,accept='image/*,.pdf'){const u=media(val),isImg=String(accept).includes('image');return `<label class="${full?'full':''} file-field">${requiredFlag?required(label):label}<div class="file-drop-zone" data-file-zone><input type="file" name="${name}" accept="${accept}"><div class="file-drop-hint"><i class="fa-solid fa-cloud-arrow-up"></i><span>ছবি/ফাইল এখানে Drag & Drop করুন অথবা ক্লিক করে নির্বাচন করুন</span></div><div class="image-preview ${u?'has-file':''}" data-preview>${u&&isImg?`<img src="${esc(u)}">`:''}<span class="file-name">${u?'বর্তমান ফাইল':''}</span></div></div></label>`}
function listTable(rows,cols,key){return `<div class="list-toolbar"><div class="left">প্রতি পেজে <select class="global-page-size"><option>10</option><option>20</option><option>50</option></select> টি</div><div class="right">খুঁজুন: <input class="table-search global-list-search" type="search"></div></div><div class="table-scroll"><table class="admin-table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>অ্যাকশন</th></tr></thead><tbody>${rows.map(r=>`<tr data-search="${esc(Object.values(r).map(x=>typeof x==='string'?x:'').join(' ').toLowerCase())}">${cols.map(c=>`<td>${c[2]?c[2](r[c[0]],r):esc(r[c[0]]??'')}</td>`).join('')}<td><button class="btn tiny edit" data-edit="${key}" data-id="${esc(r.id)}"><i class="fa-solid fa-pen"></i></button> <button class="btn tiny danger" data-del="${key}" data-id="${esc(r.id)}"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div><div class="global-table-pager"><span class="gp-info"></span><span class="gp-buttons"><button class="gp-prev">আগে</button><span class="gp-current">১</span><button class="gp-next">পরবর্তী</button></span></div>`}
function activatePager(){document.querySelectorAll('.table-card').forEach(card=>{const table=card.querySelector('table'),search=card.querySelector('.global-list-search'),size=card.querySelector('.global-page-size'),prev=card.querySelector('.gp-prev'),next=card.querySelector('.gp-next'),cur=card.querySelector('.gp-current'),info=card.querySelector('.gp-info');if(!table||!prev)return;let page=1;const all=[...table.tBodies[0].rows];function draw(){const q=(search?.value||'').toLowerCase();const m=all.filter(r=>r.dataset.search.includes(q));const ps=+(size?.value||10),pages=Math.max(1,Math.ceil(m.length/ps));page=Math.min(page,pages);all.forEach(r=>r.style.display='none');m.slice((page-1)*ps,page*ps).forEach(r=>r.style.display='');const a=m.length?(page-1)*ps+1:0,b=Math.min(page*ps,m.length);info.textContent=`${bn(m.length)}টির মধ্যে ${bn(a)}-${bn(b)} দেখানো হচ্ছে`;cur.textContent=bn(page);prev.disabled=page<=1;next.disabled=page>=pages}search&&search.addEventListener('input',()=>{page=1;draw()});size&&size.addEventListener('change',()=>{page=1;draw()});prev.onclick=()=>{page--;draw()};next.onclick=()=>{page++;draw()};draw()})}
function dashboard(){const counts=[['স্লাইডার',(DATA.slides||[]).length],['নোটিশ',(DATA.notices||[]).length],['শিক্ষক/কর্মচারী',(DATA.staff||[]).length],['গ্যালারি',(DATA.gallery||[]).length]];return banner('DASHBOARD','Dashboard','ওয়েবসাইট ম্যানেজমেন্টের সারসংক্ষেপ')+`<div class="dashboard-cards">${counts.map(x=>`<div><b>${bn(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div>`}
function school(){const s=DATA.school||{};return banner('SCHOOL INFORMATION','বিদ্যালয়ের তথ্য','বিদ্যালয়ের নাম, ঠিকানা, যোগাযোগ ও পরিচিতি এক জায়গা থেকে পরিচালনা করুন')+`<form id="schoolForm"><div class="school-form-grid"><section class="form-card"><div class="card-title"><i class="fa-solid fa-language"></i><div><b>বাংলা তথ্য</b><small>বিদ্যালয়ের বাংলা তথ্য পূরণ করুন</small></div></div><div class="form-grid">${fld('nameBn',required('বিদ্যালয়ের নাম (বাংলা)'),s.nameBn||s.school_name_bn||'')}${fld('upazilaBn',required('উপজেলা (বাংলা)'),s.upazilaBn||'')}${fld('postOfficeBn',required('পোস্ট অফিস (বাংলা)'),s.postOfficeBn||'')}${fld('districtBn',required('জেলা (বাংলা)'),s.districtBn||'', 'text',true)}${fld('phoneHeadteacher',required('প্রধান শিক্ষকের ফোন'),s.phoneHeadteacher||s.phone||'')}${fld('phoneOffice',required('অফিস সহকারীর ফোন'),s.phoneOffice||'')}${fld('descriptionBn','বিদ্যালয় সম্পর্কে সংক্ষিপ্ত বর্ণনা',s.descriptionBn||'','textarea',true)}${fileFld('schoolLogo','বিদ্যালয়ের লোগো',s.schoolLogoObj||s.schoolLogo,true)}${fileFld('boardLogo','শিক্ষা বোর্ডের লোগো',s.boardLogoObj||s.boardLogo,true)}</div></section><section class="form-card"><div class="card-title"><i class="fa-solid fa-language"></i><div><b>English Information</b><small>Enter the school's English information</small></div></div><div class="form-grid">${fld('nameEn',required('School Name (English)'),s.nameEn||'')}${fld('postOfficeEn',required('Post Office (English)'),s.postOfficeEn||'')}${fld('upazilaEn',required('Upazila (English)'),s.upazilaEn||'')}${fld('districtEn',required('District (English)'),s.districtEn||'')}${fld('eiin',required('EIIN'),s.eiin||'')}${fld('schoolCode',required('School Code'),s.schoolCode||'')}${fld('established',required('Established Year'),s.established||'')}${fld('email',required('Email'),s.email||'','email')}${fld('facebook','Facebook Page Link',s.facebook||'','text',true)}${fld('youtube','YouTube Channel Link',s.youtube||'','text',true)}${fld('institutionType',required('প্রতিষ্ঠানের ধরন'),s.institutionType||'','select',true,['','মাধ্যমিক বিদ্যালয়','উচ্চ বিদ্যালয়','স্কুল এন্ড কলেজ'])}</div></section><div class="form-actions full-width"><span>সংরক্ষণ করলে ওয়েবসাইটের সংশ্লিষ্ট তথ্য আপডেট হবে।</span><button class="btn primary"><i class="fa-solid fa-check"></i> তথ্য সংরক্ষণ করুন</button></div></div></form>`}

function crud(key){const sc=schemas[key],rows=DATA[key]||[];return banner(sc.ey,sc.title,sc.desc,`${bn(rows.length)} টি`)+`<div class="two-card-grid"><section class="form-card"><div class="card-title"><i class="fa-solid fa-pen-to-square"></i><div><b>${sc.title}</b><small>তারকা চিহ্নিত তথ্য অবশ্যই দিতে হবে</small></div></div><form id="crudForm" data-key="${key}" class="stack-form"><input type="hidden" name="id">${sc.fields.map(f=>{const [n,l,t='text',req,raw=[]]=f;let o=raw;if(key==='staff'&&n==='subject')o=[['','বিষয় নির্বাচন করুন'],...subjectChoices()];if(key==='staff'&&n==='designation')o=[['','পদবি নির্বাচন করুন'],...DESIGNATIONS];if(key==='staff'&&n==='district')o=[['','জেলা নির্বাচন করুন'],...DISTRICTS];if(key==='staff'&&n==='upazila')o=[['','উপজেলা নির্বাচন করুন']];if(key==='staff'&&['gender','religion','blood_group','marital_status'].includes(n))o=[['','নির্বাচন করুন'],...raw];if(t==='file')return fileFld(n,l,'',!!req,true,key==='notices'||key==='holidays'?'.pdf,image/*':'image/*');return fld(n,req?required(l):l,'',t,true,o)}).join('')}<div class="form-actions"><button type="button" class="btn edit" id="resetCrud">বাতিল</button><button class="btn primary">সংরক্ষণ করুন</button></div></form></section><section class="table-card"><div class="card-title"><i class="fa-solid fa-list"></i><div><b>${sc.title} তালিকা</b><small>সংরক্ষিত সকল তথ্য</small></div></div>${listTable(rows,[['image','ছবি',(v,r)=>{const u=media(v||r.file);return u?`<img class="thumb" src="${esc(u)}">`:''}],['name','নাম/শিরোনাম',(v,r)=>esc(v||r.title||r.history_text||'').slice(0,100)],['designation','ধরন/পদবি',(v,r)=>esc(v||r.staff_type||r.class_name||r.publish_date||'')]],key)}</section></div>`}

function subjectSection(){const rows=DATA.subjects||[];return banner('ACADEMIC SETTINGS','বিষয় ব্যবস্থাপনা','নির্ধারিত বিষয় তালিকা থেকে বিষয় নির্বাচন করলে Subject ID ও Subject Code অটো বসবে',`${bn(rows.length)} টি`)+`<div class="two-card-grid subject-manager-grid"><section class="form-card subject-form-card"><div class="card-title"><i class="fa-solid fa-plus"></i><div><b>বিষয় যোগ করুন</b><small>বিষয়ের নাম নিচ থেকে বাছুন।</small></div></div><form id="subjectForm" class="stack-form subject-stack-form"><input type="hidden" name="id"><label>${required('বিষয় নাম (SNAME)')}<select name="catalog_id" id="subjectCatalog"><option value="">বিষয়ের নাম নিচ থেকে বাছুন</option>${SUBJECT_CATALOG.map(x=>`<option value="${x.id}" data-code="${x.code}" data-bn="${esc(x.bn)}" data-en="${esc(x.en)}">${esc(x.bn)}</option>`).join('')}</select><span class="help">বিষয় নির্বাচন করলে নিচের তথ্যগুলো স্বয়ংক্রিয়ভাবে বসবে।</span></label><div class="form-grid"><label>Subject ID (SUBJID)<input name="subject_id" id="subjectId" readonly placeholder="অটো বসবে"></label><label>Subject Code (SCODE)<input name="code" id="subjectCode" readonly placeholder="অটো বসবে"></label><label>নির্বাচিত বাংলা নাম<input name="name" id="subjectBn" readonly></label><label>ইংরেজি বিষয় নাম<input name="name_en" id="subjectEn" readonly></label></div><label class="active-line"><input type="checkbox" name="is_active" value="1" checked> Active রাখুন</label><div class="form-actions"><button type="button" class="btn edit" id="resetSubject">বাতিল</button><button class="btn primary">তথ্য সংরক্ষণ করুন</button></div></form></section><section class="table-card subject-table-card"><div class="card-title"><i class="fa-solid fa-list"></i><div><b>বিষয়ের তালিকা</b><small>সংরক্ষিত বিষয়সমূহ</small></div></div>${listTable(rows,[['name','বিষয় নাম'],['subject_id','SUBJID'],['code','SCODE'],['name_en','English Name']],'subjects')}</section></div>`}
function subjectChoices(){const d=(DATA.subjects||[]).map(x=>x.name).filter(Boolean);return [...new Set([...d,'বাংলা','ইংরেজি','গণিত','বিজ্ঞান','ধর্ম','কৃষি শিক্ষা','আইসিটি','শারীরিক শিক্ষা','N/A'])]}
function optionHtml(arr,val='',placeholder='নির্বাচন করুন'){return `<option value="">${placeholder}</option>`+arr.map(v=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(v)}</option>`).join('')}

lic Website-এ আপডেট হবে।</span><button class="btn primary">তথ্য সংরক্ষণ করুন</button></div></form></section>`}

function routine(){const rows=DATA.routines||[];const subjects=subjectChoices();return banner('ROUTINE MANAGEMENT','রুটিন আপডেট করুন','৬ষ্ঠ-৮ম শ্রেণিতে শাখা এবং ৯ম-১০ম শ্রেণিতে বিভাগ অনুযায়ী রুটিন পরিচালনা করুন',`${bn(rows.length)} টি`)+`<div class="two-card-grid routine-manager-grid"><section class="form-card"><div class="card-title"><i class="fa-solid fa-calendar-days"></i><div><b>রুটিন আপডেট</b><small>শ্রেণি, শাখা/বিভাগ ও বার নির্বাচন করুন</small></div></div><form id="routineForm" class="stack-form"><input type="hidden" name="id">${fld('class_name',required('শ্রেণি'),'৬ষ্ঠ','select',true,CLASS_OPTIONS)}<label>${required('<span id="routineGroupLabel">শাখা</span>')}<select name="group" id="routineGroup"></select></label>${fld('day_name',required('বার'),'রবিবার','select',true,['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'])}<div class="routine-periods routine-subject-grid">${Array.from({length:8},(_,i)=>`<label>${['প্রথম','দ্বিতীয়','তৃতীয়','চতুর্থ','পঞ্চম','ষষ্ঠ','সপ্তম','অষ্টম'][i]} ঘণ্টা<select name="p${i}"><option value="নাই">নাই</option>${subjects.map(v=>`<option>${esc(v)}</option>`).join('')}</select></label>`).join('')}</div><div class="form-actions"><button type="button" class="btn edit" id="resetRoutine">বাতিল</button><button class="btn primary">রুটিন আপডেট করুন</button></div></form></section><section class="table-card"><div class="card-title"><i class="fa-solid fa-list"></i><div><b>রুটিন তালিকা</b><small>সংরক্ষিত রুটিন</small></div></div>${listTable(rows,[['class_name','শ্রেণি'],['group','শাখা/বিভাগ'],['day_name','বার']], 'routines')}</section></div>`}
function social(kind){const title=kind==='facebook'?'ফেসবুক লিংক যোগ করুন':'ইউটিউব যোগ করুন',name=kind==='facebook'?'Facebook Page Link':'YouTube Channel Link',v=DATA.school?.[kind]||'';return banner('SOCIAL LINK',title,`${name} আপডেট করুন`)+`<section class="form-card social-single"><form id="socialForm" data-kind="${kind}" class="stack-form">${fld('url',required(name),v,'url',true)}<div class="form-actions"><span>সংরক্ষণ করলে ওয়েবসাইটে লিংক আপডেট হবে।</span><button class="btn primary">সংরক্ষণ করুন</button></div></form></section>`}
function enableFilePreviews(){document.querySelectorAll('[data-file-zone]').forEach(zone=>{const input=zone.querySelector('input[type=file]'),preview=zone.querySelector('[data-preview]'),hint=zone.querySelector('.file-drop-hint');if(!input||!preview)return;const show=file=>{if(!file)return;preview.classList.add('has-file');preview.innerHTML='';if(file.type&&file.type.startsWith('image/')){const img=document.createElement('img');img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);preview.appendChild(img)}const span=document.createElement('span');span.className='file-name';span.textContent=file.name;preview.appendChild(span);if(hint)hint.style.display='none'};input.addEventListener('change',()=>show(input.files&&input.files[0]));['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('dragging')}));['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('dragging')}));zone.addEventListener('drop',e=>{const files=e.dataTransfer&&e.dataTransfer.files;if(!files||!files.length)return;const dt=new DataTransfer();dt.items.add(files[0]);input.files=dt.files;show(files[0])})})}
function render(){let h='';switch(current){case'dashboard':h=dashboard();break;case'school':h=school();break;case'slides':case'notices':case'holidays':case'history':case'merit':case'gallery':case'staff':h=crud(current);break;case'branches':h=branchSection();break;case'classes':h=classSection();break;case'subjects':h=subjectSection();break;case'students':h=students();break;case'routine':h=routine();break;case'permission':h=documents('permission','পাঠদানের অনুমতি পত্র');break;case'recognition':h=documents('recognition','একাডেমিক স্বীকৃতি');break;case'first_mpo':h=documents('first_mpo','প্রথম এমপিও');break;case'branch_info':h=documents('branch_info','শাখা তথ্য');break;case'other':h=documents('other','অন্যান্য তথ্য');break;case'president':h=committee('সভাপতি','সভাপতির তথ্য যোগ করুন');break;case'secretary':h=committee('সদস্য সচিব','সদস্য সচিবের তথ্য যোগ');break;case'guardian':h=committee('অভিভাবক সদস্য','অভিভাবক সদস্য যোগ করুন');break;case'member':h=committee('সদস্য','সদস্য যোগ করুন');break;case'headteacher':h=headteacher();break;case'facebook':h=social('facebook');break;case'youtube':h=social('youtube');break;}$('#content').innerHTML=h;bind();enableFilePreviews();activatePager();updateHeader();bindReferenceControls()}
function bindReferenceControls(){
 const cf=$('#classForm');if(cf){cf.elements.name.onchange=updateClassFields;updateClassFields();$('#resetClass').onclick=()=>{cf.reset();updateClassFields()};cf.onsubmit=async e=>{e.preventDefault();const item=getFormObj(cf),old=(DATA.classes||[]).find(x=>String(x.id)===String(item.id));item.branch=item.branch||'নাই';item.section=item.section||'নাই';item.is_active=1;await call({action:'upsert',collection:'classes',item});await syncClassGroups();success(item.id?'শ্রেণি, শাখা ও বিভাগের তথ্য আপডেট হয়েছে।':'শ্রেণি, শাখা ও বিভাগ সফলভাবে যোগ হয়েছে।');render()}}
 const sf=$('#subjectForm');if(sf){sf.elements.catalog_id.onchange=updateSubjectCatalog;updateSubjectCatalog();$('#resetSubject').onclick=()=>{sf.reset();updateSubjectCatalog()};sf.onsubmit=async e=>{e.preventDefault();const item=getFormObj(sf);if(!item.catalog_id){alert('বিষয়ের নাম নির্বাচন করুন।');return}item.is_active=sf.elements.is_active.checked?1:0;item.sort_order=Number(item.subject_id||0);await call({action:'upsert',collection:'subjects',item});success('বিষয় সফলভাবে সংরক্ষণ হয়েছে।');render()}}
 const hf=$('#headForm');if(hf){fillUpazila(hf,'district','upazila',DATA.headteacher?.upazila||'');hf.elements.district.onchange=()=>fillUpazila(hf);}
 const staff=$('#crudForm');if(staff&&staff.dataset.key==='staff'){const subj=staff.elements.subject, dist=staff.elements.district, up=staff.elements.upazila;if(subj){const old=subj.value;subj.innerHTML=optionHtml(subjectChoices(),old,'বিষয় নির্বাচন করুন');if(old)subj.value=old}if(dist&&up){fillUpazila(staff,'district','upazila',up.dataset.wanted||up.value);dist.onchange=()=>fillUpazila(staff)}}
}
function nav(sec){current=sec;document.querySelectorAll('.nav-btn[data-sec]').forEach(b=>b.classList.toggle('active',b.dataset.sec===sec));document.querySelectorAll('.menu-group').forEach(g=>{const active=g.querySelector(`.nav-btn[data-sec="${sec}"]`);if(active)g.open=true});render();window.scrollTo({top:0})}
document.querySelector('.admin-sidebar').addEventListener('click',e=>{const b=e.target.closest('.nav-btn[data-sec]');if(b)nav(b.dataset.sec)});document.querySelectorAll('.menu-group').forEach(g=>g.addEventListener('toggle',()=>{if(g.open)document.querySelectorAll('.menu-group').forEach(o=>{if(o!==g)o.open=false})}));
function getFormObj(f){const o={};new FormData(f).forEach((v,k)=>{if(!(v instanceof File))o[k]=v});return o}
function resetForm(f){f.reset();if(f.elements.id)f.elements.id.value=''}
async function deleteItem(collection,id){await call({action:'delete',collection,id});success('তথ্য সফলভাবে ডিলেট হয়েছে');render()}
function editItem(collection,id){let rows=DATA[collection]||[];let x=rows.find(r=>String(r.id)===String(id));if(!x)return;if(collection==='committee'){const form=$('#committeeForm');for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}form.scrollIntoView({behavior:'smooth'});return}if(collection==='documents'){const form=$('#docForm');for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}form.scrollIntoView({behavior:'smooth'});return}if(collection==='classes'){const form=$('#classForm');if(!form)return;for(const [k,v] of Object.entries(x)){if(form.elements[k])form.elements[k].value=v??''}updateClassFields();form.scrollIntoView({behavior:'smooth'});return}if(collection==='subjects'){const form=$('#subjectForm');if(!form)return;form.elements.id.value=x.id||'';const c=SUBJECT_CATALOG.find(v=>String(v.id)===String(x.subject_id)||v.bn===x.name);if(c)form.elements.catalog_id.value=String(c.id);updateSubjectCatalog();form.elements.is_active.checked=Number(x.is_active??1)===1;form.scrollIntoView({behavior:'smooth'});return}if(collection==='staff'){const form=$('#crudForm');if(!form)return;for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}if(form.elements.district){form.elements.district.value=x.district||'';fillUpazila(form,'district','upazila',x.upazila||'')}form.scrollIntoView({behavior:'smooth'});return}if(collection==='routines'){const form=$('#routineForm');form.elements.id.value=x.id;form.elements.class_name.value=x.class_name;refreshGroups(x.group);form.elements.day_name.value=x.day_name;(x.periods||[]).forEach((v,i)=>form.elements['p'+i].value=v||'');form.scrollIntoView({behavior:'smooth'});return}const form=$('#crudForm')||$('#genericForm');if(!form)return;for(const [k,v] of Object.entries(x)){if(form.elements[k]&&form.elements[k].type!=='file')form.elements[k].value=v??''}form.scrollIntoView({behavior:'smooth'})}
function bind(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete(()=>deleteItem(b.dataset.del,b.dataset.id)));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit,b.dataset.id));$('#modalRoot').onclick=e=>{if(e.target.closest('.global-feedback-ok'))$('#modalRoot').innerHTML=''};
const sf=$('#schoolForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();const v=getFormObj(sf);for(const n of ['schoolLogo','boardLogo']){const file=sf.elements[n].files[0];if(file){const up=await uploadFile(file);v[n]=up.url;v[n+'Obj']=up}else{v[n]=DATA.school?.[n]||'';v[n+'Obj']=DATA.school?.[n+'Obj']||null}}v.phone=v.phoneHeadteacher||DATA.school?.phone||'';v.address=[v.postOfficeBn&&('পোস্ট: '+v.postOfficeBn),v.upazilaBn&&('উপজেলা: '+v.upazilaBn),v.districtBn&&('জেলা: '+v.districtBn)].filter(Boolean).join(', ');v.shortAddress=[v.upazilaBn,v.districtBn].filter(Boolean).join(', ');await call({action:'saveSchool',value:v});success('বিদ্যালয়ের তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()};
const cf=$('#crudForm');if(cf){$('#resetCrud').onclick=()=>resetForm(cf);cf.onsubmit=async e=>{e.preventDefault();const key=cf.dataset.key,item=getFormObj(cf),old=(DATA[key]||[]).find(x=>String(x.id)===String(item.id));for(const f of schemas[key].fields){if(f[2]==='file'){const file=cf.elements[f[0]].files[0];if(file){const up=await uploadFile(file);item[f[0]]=up.url;item[f[0]+'_meta']=up}else if(old)item[f[0]]=media(old[f[0]])}}item.sort_order=Number(item.sort_order||0);item.is_active=1;await call({action:'upsert',collection:key,item});success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const gf=$('#genericForm');if(gf){$('#resetGeneric').onclick=()=>resetForm(gf);gf.onsubmit=async e=>{e.preventDefault();const item=getFormObj(gf);item.is_active=1;await call({action:'upsert',collection:gf.dataset.collection,item});if(gf.dataset.collection==='branches'||gf.dataset.collection==='classes')await syncClassGroups();success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const df=$('#docForm');if(df){$('#resetDoc').onclick=()=>resetForm(df);df.onsubmit=async e=>{e.preventDefault();const item=getFormObj(df),old=(DATA.documents||[]).find(x=>String(x.id)===String(item.id));item.doc_type=df.dataset.type;const file=df.elements.file.files[0];if(file){const up=await uploadFile(file);item.file=up.url;item.file_meta=up}else if(old)item.file=media(old.file);item.is_active=1;await call({action:'upsert',collection:'documents',item});success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const cm=$('#committeeForm');if(cm){$('#resetCommittee').onclick=()=>resetForm(cm);cm.onsubmit=async e=>{e.preventDefault();const item=getFormObj(cm),old=(DATA.committee||[]).find(x=>String(x.id)===String(item.id));item.member_type=cm.dataset.type;const file=cm.elements.image.files[0];if(file){const up=await uploadFile(file);item.image=up.url;item.image_meta=up}else if(old)item.image=media(old.image);item.sort_order=Number(item.sort_order||0);item.is_active=1;await call({action:'upsert',collection:'committee',item});success('তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const hf=$('#headForm');if(hf)hf.onsubmit=async e=>{e.preventDefault();const v=getFormObj(hf),file=hf.elements.image.files[0];if(file){const up=await uploadFile(file);v.image=up.url;v.image_meta=up}else v.image=media(DATA.headteacher?.image);v.is_headteacher=1;await call({action:'saveHeadteacher',value:v});success('প্রধান শিক্ষকের তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()};
const st=$('#studentsForm');if(st)st.onsubmit=async e=>{e.preventDefault();const rows=[...st.querySelectorAll('tbody tr')].map(tr=>{const x={className:tr.dataset.class};['total','male','female','muslim','hindu','christian','buddhist','other'].forEach(k=>x[k]=Number(tr.querySelector(`[name="${k}"]`).value||0));return x});await call({action:'replace',collection:'students',value:rows});success('শিক্ষার্থীর তথ্য সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()};
const rf=$('#routineForm');if(rf){refreshGroups();rf.elements.class_name.onchange=()=>refreshGroups();$('#resetRoutine').onclick=()=>{resetForm(rf);refreshGroups()};rf.onsubmit=async e=>{e.preventDefault();const v=getFormObj(rf),item={id:v.id,class_name:v.class_name,group:v.group,branch_name:v.group,day_name:v.day_name,periods:Array.from({length:8},(_,i)=>v['p'+i]||''),is_active:1};await call({action:'upsert',collection:'routines',item});success('রুটিন সম্পূর্ণ সফলভাবে আপডেট হয়েছে');render()}};
const soc=$('#socialForm');if(soc)soc.onsubmit=async e=>{e.preventDefault();const kind=soc.dataset.kind,value={...(DATA.school||{}),[kind]:soc.elements.url.value};await call({action:'saveSchool',value});success('লিংক সফলভাবে আপডেট হয়েছে');render()}}
function refreshGroups(wanted=''){const f=$('#routineForm');if(!f)return;const cls=f.elements.class_name.value,senior=['৯ম','১০ম'].includes(cls);const fallback=senior?DIVISION_OPTIONS:(DATA.branches||[]).map(x=>x.name).filter(Boolean);const g=(DATA.classGroups?.[cls]||[]).length?(DATA.classGroups[cls]):fallback,s=f.elements.group;s.innerHTML=g.map(x=>`<option>${esc(x)}</option>`).join('');const lab=$('#routineGroupLabel');if(lab)lab.textContent=senior?'বিভাগ':'শাখা';if(wanted&&g.includes(wanted))s.value=wanted}
async function syncClassGroups(){const groups={'৬ষ্ঠ':[],'৭ম':[],'৮ম':[],'৯ম':[],'১০ম':[]},branches=DATA.branches||[];for(const c of DATA.classes||[]){if(['৬ষ্ঠ','৭ম','৮ম'].includes(c.name)){const g=c.branch||'';if(g&&!groups[c.name].includes(g))groups[c.name].push(g)}else if(['৯ম','১০ম'].includes(c.name)){const g=c.section||'';if(g&&!groups[c.name].includes(g))groups[c.name].push(g)}}if(!(DATA.classes||[]).length){for(const c of ['৬ষ্ঠ','৭ম','৮ম'])groups[c]=branches.map(b=>b.name).filter(Boolean)}await call({action:'saveClassGroups',value:groups})}

$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const j=await r.json();if(!r.ok){$('#loginMsg').innerHTML=`<div class="err">${j.error==='admin_password_not_configured'?'ADMIN_PASSWORD সেট করা হয়নি।':'Password সঠিক নয়।'}</div>`;return}location.reload()};
