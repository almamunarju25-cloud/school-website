<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher/Student Account</title><link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="admin.css"><style>.box{max-width:1000px;margin:25px auto;background:#fff;padding:22px;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:5px;font-weight:600}input,select{padding:10px;border:1px solid #ccd8e5;border-radius:7px;font:inherit}.btn{margin-top:14px}.msg{margin:12px 0;color:#176c43}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main class="box"><a href="index.html">← Admin Dashboard</a><h1>Teacher ও Student Account</h1><p>প্রতিটি user-এর login identity ও password সংরক্ষণ করুন।</p><form id="f" class="grid"><label>Role<select id="role"><option value="teacher">Teacher</option><option value="student">Student</option></select></label><label>নাম<input id="name" required></label><label>Login ID / Email<input id="identity" required></label><label>Password<input id="password" required></label><label>Class (Student হলে)<input id="className"></label><label>Subject (Teacher হলে)<input id="subject"></label><button class="btn primary">Account Save</button></form><div id="msg" class="msg"></div><h2>বর্তমান Account</h2><div id="list">লোড হচ্ছে...</div></main><script>let data;async function load(){let r=await fetch('/.netlify/functions/admin-api');if(!r.ok){location.href='index.html';return}data=await r.json();list.innerHTML=(data.users||[]).map(x=>'<p><b>'+x.role+'</b> — '+x.name+' — '+x.identity+'</p>').join('')||'কোনো account নেই'}f.onsubmit=async e=>{e.preventDefault();let item={id:identity.value,role:role.value,name:name.value,identity:identity.value,password:password.value,active:true,class:className.value,subject:subject.value};let r=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'upsert',collection:'users',item})});msg.textContent=r.ok?'Account সংরক্ষণ হয়েছে':'সংরক্ষণ করা যায়নি';if(r.ok){f.reset();load()}};load()</script>
