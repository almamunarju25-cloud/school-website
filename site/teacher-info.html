<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>শিক্ষক-কর্মচারী | বল্লভপুর উচ্চ বিদ্যালয়</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;font-family:"Noto Sans Bengali","Kalpurush","Times New Roman",sans-serif;color:#234e58}
.page{width:min(1240px,94%);margin:28px auto 55px;background:#fff;min-height:760px;box-shadow:0 5px 25px #1b56610d}
.hero{min-height:132px;padding:24px 28px;display:flex;align-items:center;background:linear-gradient(115deg,#347d87,#6fc1c8);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff22;border-radius:50%;right:-45px;top:-90px}.hero-icon{width:54px;height:54px;border:1px solid #ffffff88;border-radius:13px;display:grid;place-items:center;font-size:24px;margin-right:14px}
.hero small{font-size:13px}.hero h1{margin:2px 0;font-size:31px;font-weight:600}.hero p{margin:4px 0 0;font-size:14px;opacity:.92}.home{position:absolute;right:28px;color:#fff;text-decoration:none;border:1px solid #ffffff99;border-radius:20px;padding:8px 14px;z-index:2}
.content{padding:25px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce8ea;padding-bottom:13px;margin-bottom:20px}.bar h2{margin:0;font-size:21px;font-weight:600}.count{background:#edf9f9;border:1px solid #d5ecee;padding:7px 13px;border-radius:20px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1px solid #d8e8ea;border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 7px 20px #245f6910;transition:.22s;position:relative}.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #245f6920}
.top{height:105px;background:linear-gradient(120deg,#58b5bf,#77c9c4)}.photo{display:block;width:94px;height:94px;border-radius:50%;object-fit:cover;border:5px solid #fff;margin:-51px auto 9px;background:#eef4f5;box-shadow:0 3px 10px #0002}.body{text-align:center;padding:0 15px 16px}.body h3{font-size:18px;margin:0;color:#214f59}.en{font-size:11px;color:#829399;min-height:17px}.role{display:inline-block;margin:8px 0 12px;padding:5px 10px;border-radius:16px;background:#fff7e8;border:1px solid #f1d9ad;color:#956c2b;font-size:12px}
.meta{text-align:left;border-top:1px solid #edf2f3;padding-top:9px;font-size:12px;color:#58757b}.meta div{padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta i{width:20px;color:#238695}.details{margin-top:12px;width:100%;display:flex;justify-content:center;align-items:center;gap:7px;padding:9px 12px;border-radius:9px;background:#287f8b;color:#fff;text-decoration:none;font-size:13px}.details:hover{background:#1f6d77}
.empty{grid-column:1/-1;padding:60px;text-align:center;color:#7b9095}.empty i{font-size:38px;margin-bottom:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:23px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.home{right:15px;top:15px}.hero{padding-top:55px}.content{padding:16px}}
</style></head>
<body><main class="page"><header class="hero"><div class="hero-icon"><i class="fa-solid fa-chalkboard-user"></i></div><div><small>আমাদের শিক্ষা পরিবারের</small><h1>শিক্ষক-কর্মচারী</h1><p>ওয়েব ম্যানেজমেন্টে সংরক্ষিত সকল শিক্ষক ও কর্মচারীর পরিচিতি এবং বিস্তারিত তথ্য</p></div><a class="home" href="index.html"><i class="fa-solid fa-house"></i> হোমপেজ</a></header>
<section class="content"><div class="bar"><h2>শিক্ষক-কর্মচারী পরিচিতি</h2><span class="count" id="count">লোড হচ্ছে...</span></div><div class="grid" id="grid"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><br>তথ্য লোড হচ্ছে...</div></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=v=>v?esc(v):'Mamun.jpg';
async function load(){
 const grid=document.getElementById('grid'),count=document.getElementById('count');
 try{
  const r=await fetch('/.netlify/functions/public-api?kind=staff&_='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0;
  const j=await r.json(), rows=Array.isArray(j.data)?j.data:[];
  count.innerHTML='<i class="fa-solid fa-users"></i> মোট '+rows.length+' জন';
  if(!rows.length){grid.innerHTML='<div class="empty"><i class="fa-solid fa-users-slash"></i><br>এখনও কোনো শিক্ষক/কর্মচারীর তথ্য যোগ করা হয়নি।</div>';return}
  grid.innerHTML=rows.map((t,i)=>`<article class="card"><div class="top"></div><img class="photo" src="${image(t.image)}" alt="${esc(t.name)}" onerror="this.src='Mamun.jpg'"><div class="body"><h3>${esc(t.name)}</h3><div class="en">${esc(t.name_en||'')}</div><span class="role">${esc(t.designation||t.staff_type||'শিক্ষক/কর্মচারী')}</span><div class="meta">${t.subject?`<div><i class="fa-solid fa-book-open"></i>${esc(t.subject)}</div>`:''}${t.phone?`<div><i class="fa-solid fa-phone"></i>${esc(t.phone)}</div>`:''}${t.email?`<div><i class="fa-solid fa-envelope"></i>${esc(t.email)}</div>`:''}</div><a class="details" href="teacher-details.html?id=${encodeURIComponent(t.id)}"><i class="fa-solid fa-circle-info"></i> বিস্তারিত</a></div></article>`).join('');
 }catch(e){count.textContent='তথ্য পাওয়া যায়নি';grid.innerHTML='<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><br>শিক্ষক-কর্মচারীর তথ্য লোড করা যায়নি। PHP/MySQL সার্ভারে পেজটি চালু করুন।</div>'}
}
load();
</script><script src="school-info.js?v=global-name-1"></script>
</body></html>
